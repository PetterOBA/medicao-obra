<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medição de Obra</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --azul:       #1a2940;
      --azul2:      #2d4a6e;
      --laranja:    #e07b20;
      --verde:      #16a34a;
      --verde-bg:   #dcfce7;
      --amarelo:    #d97706;
      --amarelo-bg: #fef9c3;
      --cinza:      #9ca3af;
      --cinza-bg:   #e5e7eb;
      --bg:         #f1f3f6;
      --branco:     #ffffff;
      --texto:      #111827;
      --texto2:     #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HEADER ─────────────────────────────────── */
    .header {
      background: var(--azul);
      color: #fff;
      padding: 13px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-info { flex: 1; min-width: 0; }
    .header h1 { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .header p  { font-size: 11px; opacity: 0.55; margin-top: 2px; }
    .btn-back {
      background: rgba(255,255,255,.12);
      border: none; color: #fff;
      width: 34px; height: 34px;
      border-radius: 8px; font-size: 18px;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* ── TELAS ───────────────────────────────────── */
    .tela { display: none; padding-bottom: 76px; }
    .tela.ativa { display: block; }

    /* ── GRID ────────────────────────────────────── */
    .legenda {
      display: flex; gap: 14px; flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--branco);
      border-bottom: 1px solid var(--cinza-bg);
    }
    .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--texto2); }
    .leg-dot { width: 13px; height: 13px; border-radius: 3px; flex-shrink: 0; }

    .contadores {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; padding: 12px 16px 4px;
    }
    .contador {
      background: var(--branco); border-radius: 10px;
      padding: 10px 8px; text-align: center;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .contador .num { font-size: 22px; font-weight: 800; line-height: 1; }
    .contador .lbl { font-size: 10px; color: var(--texto2); margin-top: 3px; }

    .grid-wrap { padding: 10px 16px 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
    }
    .casa {
      aspect-ratio: 1;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      cursor: pointer; border: none;
      transition: transform .1s;
    }
    .casa:active { transform: scale(.85); }
    .casa.sem      { background: var(--cinza-bg);   color: var(--cinza); }
    .casa.andamento{ background: var(--amarelo-bg);  color: var(--amarelo); }
    .casa.concluida{ background: var(--verde-bg);    color: var(--verde); }

    /* ── UNIDADE ─────────────────────────────────── */
    .unidade-wrap { padding: 14px 16px; }

    .btn-nova {
      width: 100%; background: var(--laranja); color: #fff;
      border: none; padding: 14px; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      margin-bottom: 14px; letter-spacing: .2px;
    }

    .card {
      background: var(--branco); border-radius: 10px;
      padding: 14px; margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .card-bread { font-size: 11px; color: var(--texto2); margin-bottom: 3px; }
    .card-nome  { font-size: 15px; font-weight: 700; color: var(--texto); margin-bottom: 10px; }
    .card-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card-field label { display: block; font-size: 10px; color: var(--cinza); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
    .card-field span  { font-size: 13px; font-weight: 600; color: var(--texto); }
    .card-field.full  { grid-column: 1/-1; }

    .badge {
      display: inline-block; padding: 2px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600;
    }
    .badge-and { background: var(--amarelo-bg); color: #92400e; }
    .badge-ok  { background: var(--verde-bg);   color: #166534; }

    .btn-concluir {
      width: 100%; margin-top: 10px;
      background: #f0fdf4; border: 1px solid #86efac;
      color: var(--verde); padding: 10px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .empty {
      text-align: center; padding: 44px 20px; color: var(--cinza);
    }
    .empty .icon { font-size: 42px; margin-bottom: 10px; }
    .empty p { font-size: 14px; line-height: 1.5; }

    /* ── FORMULÁRIO ──────────────────────────────── */
    .form-wrap { padding: 16px; }
    .campo { margin-bottom: 16px; }
    .campo > label {
      display: block; font-size: 13px; font-weight: 600;
      color: #374151; margin-bottom: 6px;
    }
    .opc { font-weight: 400; color: var(--cinza); font-size: 11px; }
    .campo select,
    .campo input[type="date"],
    .campo input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 1.5px solid var(--cinza-bg);
      border-radius: 8px; font-size: 15px;
      background: var(--branco); color: var(--texto);
      appearance: auto; -webkit-appearance: auto; outline: none;
    }
    .campo select:focus,
    .campo input:focus { border-color: var(--azul); }
    .campo select:disabled { background: #f9fafb; color: var(--cinza); }

    .btn-salvar {
      width: 100%; background: var(--azul); color: #fff;
      border: none; padding: 14px; border-radius: 10px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      transition: background .15s;
    }
    .btn-salvar:disabled { background: var(--cinza-bg); color: var(--cinza); cursor: not-allowed; }

    /* ── ADMIN ───────────────────────────────────── */
    .admin-wrap { padding: 14px 16px; }
    .sec-title { font-size: 11px; font-weight: 700; color: var(--texto2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
    .export-row { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn-exp {
      flex: 1; padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      text-align: center;
    }
    .btn-xlsx { background: #166534; border: none; color: #fff; }
    .btn-csv  { background: var(--branco); border: 1.5px solid var(--azul); color: var(--azul); }

    .resumo-card {
      background: var(--branco); border-radius: 10px;
      padding: 13px 14px; margin-bottom: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .resumo-macro { font-weight: 700; font-size: 14px; color: var(--texto); }
    .resumo-sub   { font-size: 12px; color: var(--texto2); margin-top: 2px; }
    .resumo-pct   { font-size: 20px; font-weight: 800; }

    /* ── BOTTOM NAV ──────────────────────────────── */
    .bottom-nav {
      position: fixed; bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: var(--branco);
      border-top: 1px solid var(--cinza-bg);
      display: flex; z-index: 200;
    }
    .nav-btn {
      flex: 1; padding: 10px 8px 12px;
      border: none; background: none;
      font-size: 11px; color: var(--cinza);
      cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      transition: color .15s;
    }
    .nav-btn.ativo { color: var(--azul); font-weight: 700; }
    .nav-icon { font-size: 22px; line-height: 1; }

    /* ── MODAL ───────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--branco); width: 100%; max-width: 480px;
      border-radius: 16px 16px 0 0; padding: 20px 16px 36px;
    }
    .modal-handle { width: 36px; height: 4px; background: var(--cinza-bg); border-radius: 999px; margin: 0 auto 16px; }
    .modal h3 { font-size: 17px; font-weight: 700; margin-bottom: 14px; }
    .btn-confirmar { width: 100%; background: var(--verde); border: none; color: #fff; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-cancelar  { width: 100%; background: none; border: none; color: var(--texto2); padding: 10px; font-size: 14px; cursor: pointer; margin-top: 6px; }

    /* ── TOAST ───────────────────────────────────── */
    .toast {
      position: fixed; bottom: 86px;
      left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff;
      padding: 11px 22px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      z-index: 999; opacity: 0;
      transition: opacity .25s; pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── LOADING ─────────────────────────────────── */
    .spinner-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 14px; color: var(--texto2); font-size: 14px; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--cinza-bg); border-top-color: var(--azul); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     TELA 1 — GRID
═════════════════════════════════════════ -->
<div id="tela-grid" class="tela ativa">
  <div class="header">
    <div class="header-info">
      <h1>Supremo Goiânia</h1>
      <p id="grid-sub">Carregando...</p>
    </div>
  </div>

  <div class="legenda">
    <div class="leg"><div class="leg-dot" style="background:var(--cinza-bg)"></div>Sem registro</div>
    <div class="leg"><div class="leg-dot" style="background:var(--amarelo-bg)"></div>Em andamento</div>
    <div class="leg"><div class="leg-dot" style="background:var(--verde-bg)"></div>Concluída</div>
  </div>

  <div class="contadores">
    <div class="contador"><div class="num" id="cnt-sem" style="color:var(--cinza)">–</div><div class="lbl">Sem registro</div></div>
    <div class="contador"><div class="num" id="cnt-and" style="color:var(--amarelo)">–</div><div class="lbl">Em andamento</div></div>
    <div class="contador"><div class="num" id="cnt-ok"  style="color:var(--verde)">–</div><div class="lbl">Concluídas</div></div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TELA 2 — UNIDADE
═════════════════════════════════════════ -->
<div id="tela-unidade" class="tela">
  <div class="header">
    <button class="btn-back" onclick="voltarGrid()">←</button>
    <div class="header-info">
      <h1 id="uni-titulo">Casa 01</h1>
      <p  id="uni-sub">0 etapas registradas</p>
    </div>
  </div>
  <div class="unidade-wrap">
    <button class="btn-nova" onclick="irForm()">＋ Nova Etapa</button>
    <div id="lista-etapas"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TELA 3 — FORMULÁRIO
═════════════════════════════════════════ -->
<div id="tela-form" class="tela">
  <div class="header">
    <button class="btn-back" onclick="voltarUnidade()">←</button>
    <div class="header-info">
      <h1 id="form-titulo">Nova Etapa</h1>
      <p  id="form-sub">–</p>
    </div>
  </div>
  <div class="form-wrap">

    <div class="campo">
      <label>Macro Etapa <span class="opc">*</span></label>
      <select id="sel-macro" onchange="onMacro()">
        <option value="">Selecione...</option>
      </select>
    </div>

    <div class="campo" id="campo-sub" style="display:none">
      <label>Sub Etapa <span class="opc">*</span></label>
      <select id="sel-sub" onchange="onSub()">
        <option value="">Selecione...</option>
      </select>
    </div>

    <div class="campo">
      <label>Tarefa <span class="opc">*</span></label>
      <select id="sel-tarefa" disabled onchange="validar()">
        <option value="">Selecione a macro etapa primeiro</option>
      </select>
    </div>

    <div class="campo">
      <label>Data de Início <span class="opc">*</span></label>
      <input type="date" id="inp-inicio" onchange="validar()">
    </div>

    <div class="campo">
      <label>Equipe <span class="opc">*</span></label>
      <input type="text" id="inp-equipe" placeholder="Ex: Equipe A, João..." oninput="validar()">
    </div>

    <div class="campo">
      <label>Data de Conclusão <span class="opc">(opcional)</span></label>
      <input type="date" id="inp-conclusao">
    </div>

    <button class="btn-salvar" id="btn-salvar" onclick="salvar()" disabled>Salvar Etapa</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     TELA 4 — ADMIN
═════════════════════════════════════════ -->
<div id="tela-admin" class="tela">
  <div class="header">
    <div class="header-info">
      <h1>Administrativo</h1>
      <p id="admin-sub">Visão geral da obra</p>
    </div>
  </div>
  <div class="admin-wrap">
    <p class="sec-title">Exportar</p>
    <div class="export-row">
      <button class="btn-exp btn-xlsx" onclick="exportXLSX()">⬇ Excel</button>
      <button class="btn-exp btn-csv"  onclick="exportCSV()">⬇ CSV</button>
    </div>
    <p class="sec-title">Progresso por macro etapa</p>
    <div id="admin-resumo"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     MODAL — REGISTRAR CONCLUSÃO
═════════════════════════════════════════ -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)fecharModal()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modal-titulo">Registrar Conclusão</h3>
    <div class="campo">
      <label>Data de Conclusão <span class="opc">*</span></label>
      <input type="date" id="inp-modal-data">
    </div>
    <button class="btn-confirmar" onclick="confirmarConclusao()">✓ Confirmar</button>
    <button class="btn-cancelar"  onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     BOTTOM NAV
═════════════════════════════════════════ -->
<nav class="bottom-nav">
  <button class="nav-btn ativo" id="nav-obra"  onclick="navObra()">
    <span class="nav-icon">🏗</span>Obra
  </button>
  <button class="nav-btn"        id="nav-admin" onclick="navAdmin()">
    <span class="nav-icon">📊</span>Admin
  </button>
</nav>

<div id="toast" class="toast"></div>

<!-- ═══════════════════════════════════════
     SCRIPT
═════════════════════════════════════════ -->
<script>
// ─── CONFIGURAÇÃO ───────────────────────────────────────────
// Cole aqui a URL gerada no Google Apps Script após o deploy
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyC25ygyRM5pv-JqGQWrbNE7T06O4mAYG_2ahOu2EsyKwQe94FZVmEHULZWi0Uyxk0/exec";

const TOTAL = 72;

// ─── ETAPAS DA OBRA ─────────────────────────────────────────
const ETAPAS = {
  "Radier": {
    subs: null,
    tarefas: ["Colocação de forma metálica","Escavação de Blocos","Infra-elétrica","Infra-esgoto","Lastro de brita e lona","Armação","Concretagem"]
  },
  "Estrutura": {
    subs: {
      "Pavimento Térreo":   ["Armação de Pilares","Fechamento de formas e pilares","Concretagem dos pilares","Fechamento de forma de vigas e lajes + Escada","Armação de vigas e lajes + Escada","Concretagem de vigas e lajes + Escada","Desforma","Retirar as Escoras"],
      "Pavimento Superior": ["Armação de Pilares","Fechamento de formas e pilares","Concretagem dos pilares","Fechamento de forma de vigas e lajes","Armação de vigas e lajes","Concretagem de vigas e lajes","Desforma","Retirar as Escoras"]
    }
  },
  "Alvenaria": {
    subs: {
      "Pavimento Térreo":   ["Marcação de alvenaria","Elevação de alvenaria - blocos","Encunhamento","Tratamento de juntas"],
      "Pavimento Superior": ["Marcação de alvenaria","Elevação de alvenaria - blocos","Encunhamento","Tratamento de juntas"]
    }
  },
  "Contrapiso": {
    subs: null,
    tarefas: ["Regularização","Impermeabilização de banheiro","Impermeabilização de laje","Proteção mecânica de laje"]
  },
  "Infra-Elétrica": {
    subs: null,
    tarefas: ["Tubulação e caixa embutida","Enfiação","Fechamento de quadros","Infra energia solar"]
  },
  "Instalações Hidráulicas": {
    subs: null,
    tarefas: ["Água fria e quente","Fechamento de tubulações Aéreas","Drenos de AC"]
  },
  "Gesso": {
    subs: null,
    tarefas: ["Tabica","Gesso em placa","Gesso corrido","Glassrock fachada"]
  },
  "Esquadrias Metálicas": {
    subs: null,
    tarefas: ["Peitoril","Janelas","Pele de vidro","Guarda Corpo"]
  },
  "Revestimento Cerâmico": {
    subs: null,
    tarefas: ["Parede","Piso","Revestimento de Pedras naturais","Soleiras","Rejuntamento"]
  },
  "Bancadas": {
    subs: null,
    tarefas: ["Banheiro","Cozinha","Lavabo","Escada de Granito"]
  },
  "Pintura Interna": {
    subs: null,
    tarefas: ["Emassamento","1º demão pintura","2º demão pintura"]
  },
  "Esquadrias": {
    subs: null,
    tarefas: ["Portas de madeira","Esquadrias metálicas"]
  },
  "Pintura Externa": {
    subs: null,
    tarefas: ["Selador","Pintura Texturizada","Recorte de Pintura"]
  },
  "Elétrica": {
    subs: null,
    tarefas: ["Acabamento elétricos"]
  },
  "Placas Solares": {
    subs: null,
    tarefas: ["Instalação"]
  },
  "Louças e Materiais": {
    subs: null,
    tarefas: ["Instalação"]
  },
  "Limpeza Final": {
    subs: null,
    tarefas: ["Interna","Externa"]
  },
  "Vistoria Técnica": {
    subs: null,
    tarefas: ["Interna","Externa"]
  }
};

// ─── ESTADO ─────────────────────────────────────────────────
let registros      = [];
let unidadeAtual   = null;
let idParaConcluir = null;

// ─── API ────────────────────────────────────────────────────
async function carregar() {
  try {
    const r = await fetch(URL_SCRIPT);
    const d = await r.json();
    if (d.success) registros = d.data;
  } catch(e) {
    toast("Erro ao conectar ao servidor");
  }
  renderGrid();
}

async function apiCall(params) {
  const url = new URL(URL_SCRIPT);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v ?? ""));
  const r = await fetch(url.toString());
  return r.json();
}

// ─── NAVEGAÇÃO ───────────────────────────────────────────────
function tela(id) {
  document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativa"));
  document.getElementById("tela-" + id).classList.add("ativa");
}

function navObra() {
  document.getElementById("nav-obra").classList.add("ativo");
  document.getElementById("nav-admin").classList.remove("ativo");
  tela("grid");
  renderGrid();
}

function navAdmin() {
  document.getElementById("nav-admin").classList.add("ativo");
  document.getElementById("nav-obra").classList.remove("ativo");
  tela("admin");
  renderAdmin();
}

function abrirUnidade(n) {
  unidadeAtual = n;
  tela("unidade");
  renderUnidade();
}

function voltarGrid()    { tela("grid");    renderGrid(); }
function voltarUnidade() { tela("unidade"); renderUnidade(); }

function irForm() {
  tela("form");
  renderForm();
}

// ─── GRID ────────────────────────────────────────────────────
function statusUnidade(n) {
  const regs = registros.filter(r => Number(r.Unidade) === n);
  if (!regs.length) return "sem";
  if (regs.some(r => !r.DataConclusao)) return "andamento";
  return "concluida";
}

function renderGrid() {
  const g = document.getElementById("grid");
  g.innerHTML = "";
  let sem = 0, and = 0, ok = 0;

  for (let i = 1; i <= TOTAL; i++) {
    const s = statusUnidade(i);
    if (s === "sem") sem++;
    else if (s === "andamento") and++;
    else ok++;

    const b = document.createElement("button");
    b.className = "casa " + s;
    b.textContent = String(i).padStart(2, "0");
    b.onclick = () => abrirUnidade(i);
    g.appendChild(b);
  }

  document.getElementById("grid-sub").textContent = registros.length + " registros no total";
  document.getElementById("cnt-sem").textContent = sem;
  document.getElementById("cnt-and").textContent = and;
  document.getElementById("cnt-ok").textContent  = ok;
}

// ─── UNIDADE ─────────────────────────────────────────────────
function renderUnidade() {
  const regs = registros
    .filter(r => Number(r.Unidade) === unidadeAtual)
    .sort((a, b) => Number(b.ID) - Number(a.ID));

  const lbl = "Casa " + String(unidadeAtual).padStart(2, "0");
  document.getElementById("uni-titulo").textContent = lbl;
  document.getElementById("uni-sub").textContent =
    regs.length + " etapa" + (regs.length !== 1 ? "s" : "") + " registrada" + (regs.length !== 1 ? "s" : "");

  const lista = document.getElementById("lista-etapas");
  if (!regs.length) {
    lista.innerHTML = `<div class="empty"><div class="icon">📋</div><p>Nenhuma etapa registrada<br>para esta unidade ainda.</p></div>`;
    return;
  }

  lista.innerHTML = regs.map(r => {
    const concluido = !!r.DataConclusao;
    const bread = [r.Macro, r.Sub].filter(Boolean).join(" › ");
    return `
      <div class="card">
        <div class="card-bread">${bread}</div>
        <div class="card-nome">${r.Tarefa}</div>
        <div class="card-grid">
          <div class="card-field">
            <label>Início</label>
            <span>${fmtData(r.DataInicio)}</span>
          </div>
          <div class="card-field">
            <label>Conclusão</label>
            <span>${concluido
              ? `<span class="badge badge-ok">✓ ${fmtData(r.DataConclusao)}</span>`
              : `<span class="badge badge-and">Em andamento</span>`}
            </span>
          </div>
          <div class="card-field full">
            <label>Equipe</label>
            <span>${r.Equipe}</span>
          </div>
        </div>
        ${!concluido ? `<button class="btn-concluir" onclick="abrirModal(${r.ID},'${esc(r.Tarefa)}')">Registrar conclusão</button>` : ""}
      </div>`;
  }).join("");
}

// ─── FORMULÁRIO ──────────────────────────────────────────────
function renderForm() {
  document.getElementById("form-titulo").textContent = "Nova Etapa";
  document.getElementById("form-sub").textContent = "Casa " + String(unidadeAtual).padStart(2, "0");

  const selM = document.getElementById("sel-macro");
  selM.innerHTML = '<option value="">Selecione...</option>';
  Object.keys(ETAPAS).forEach(m => {
    const o = document.createElement("option");
    o.value = o.textContent = m;
    selM.appendChild(o);
  });

  document.getElementById("campo-sub").style.display = "none";
  document.getElementById("sel-sub").innerHTML = '<option value="">Selecione...</option>';
  const selT = document.getElementById("sel-tarefa");
  selT.innerHTML = '<option value="">Selecione a macro etapa primeiro</option>';
  selT.disabled = true;

  document.getElementById("inp-inicio").value   = hoje();
  document.getElementById("inp-equipe").value   = "";
  document.getElementById("inp-conclusao").value = "";
  validar();
}

function onMacro() {
  const macro = document.getElementById("sel-macro").value;
  const etapa = ETAPAS[macro];
  const campSub = document.getElementById("campo-sub");
  const selSub  = document.getElementById("sel-sub");
  const selT    = document.getElementById("sel-tarefa");

  selSub.innerHTML = '<option value="">Selecione...</option>';
  selT.innerHTML   = '<option value="">Selecione...</option>';

  if (!macro || !etapa) {
    campSub.style.display = "none";
    selT.disabled = true;
    selT.innerHTML = '<option value="">Selecione a macro etapa primeiro</option>';
    validar(); return;
  }

  if (etapa.subs) {
    campSub.style.display = "block";
    Object.keys(etapa.subs).forEach(s => {
      const o = document.createElement("option");
      o.value = o.textContent = s;
      selSub.appendChild(o);
    });
    selT.disabled = true;
    selT.innerHTML = '<option value="">Selecione a sub etapa primeiro</option>';
  } else {
    campSub.style.display = "none";
    etapa.tarefas.forEach(t => {
      const o = document.createElement("option");
      o.value = o.textContent = t;
      selT.appendChild(o);
    });
    selT.disabled = false;
  }
  validar();
}

function onSub() {
  const macro = document.getElementById("sel-macro").value;
  const sub   = document.getElementById("sel-sub").value;
  const selT  = document.getElementById("sel-tarefa");

  selT.innerHTML = '<option value="">Selecione...</option>';
  if (!sub) { selT.disabled = true; validar(); return; }

  ETAPAS[macro].subs[sub].forEach(t => {
    const o = document.createElement("option");
    o.value = o.textContent = t;
    selT.appendChild(o);
  });
  selT.disabled = false;
  validar();
}

function validar() {
  const macro  = document.getElementById("sel-macro").value;
  const tarefa = document.getElementById("sel-tarefa").value;
  const inicio = document.getElementById("inp-inicio").value;
  const equipe = document.getElementById("inp-equipe").value.trim();

  let subOk = true;
  if (macro && ETAPAS[macro] && ETAPAS[macro].subs) {
    subOk = !!document.getElementById("sel-sub").value;
  }

  document.getElementById("btn-salvar").disabled = !(macro && tarefa && inicio && equipe && subOk);
}

async function salvar() {
  const btn = document.getElementById("btn-salvar");
  btn.disabled = true;
  btn.textContent = "Salvando...";

  const reg = {
    Unidade:       unidadeAtual,
    Macro:         document.getElementById("sel-macro").value,
    Sub:           document.getElementById("sel-sub").value || "",
    Tarefa:        document.getElementById("sel-tarefa").value,
    Equipe:        document.getElementById("inp-equipe").value.trim(),
    DataInicio:    document.getElementById("inp-inicio").value,
    DataConclusao: document.getElementById("inp-conclusao").value || ""
  };

  try {
    const res = await apiCall({ action: "add", ...reg });
    if (res.success) {
      reg.ID = res.id;
      registros.push(reg);
      toast("✓ Etapa salva!");
      voltarUnidade();
    } else {
      throw new Error(res.error);
    }
  } catch(e) {
    toast("Erro ao salvar. Tente novamente.");
    btn.disabled = false;
    btn.textContent = "Salvar Etapa";
  }
}

// ─── MODAL CONCLUSÃO ─────────────────────────────────────────
function abrirModal(id, tarefa) {
  idParaConcluir = id;
  document.getElementById("modal-titulo").textContent = "Concluir: " + tarefa;
  document.getElementById("inp-modal-data").value = hoje();
  document.getElementById("modal").classList.add("show");
}

function fecharModal() {
  document.getElementById("modal").classList.remove("show");
  idParaConcluir = null;
}

async function confirmarConclusao() {
  const data = document.getElementById("inp-modal-data").value;
  if (!data) { toast("Informe a data de conclusão"); return; }

  try {
    const res = await apiCall({ action: "update", id: idParaConcluir, dataConclusao: data });
    if (res.success) {
      const reg = registros.find(r => String(r.ID) === String(idParaConcluir));
      if (reg) reg.DataConclusao = data;
      fecharModal();
      toast("✓ Conclusão registrada!");
      renderUnidade();
      renderGrid();
    }
  } catch(e) {
    toast("Erro ao salvar. Tente novamente.");
  }
}

// ─── ADMIN ───────────────────────────────────────────────────
function renderAdmin() {
  document.getElementById("admin-sub").textContent = registros.length + " registros totais";

  const resumo = {};
  registros.forEach(r => {
    if (!resumo[r.Macro]) resumo[r.Macro] = { total: 0, ok: 0, unidades: new Set() };
    resumo[r.Macro].total++;
    if (r.DataConclusao) resumo[r.Macro].ok++;
    resumo[r.Macro].unidades.add(r.Unidade);
  });

  const div = document.getElementById("admin-resumo");
  if (!Object.keys(resumo).length) {
    div.innerHTML = `<div class="empty"><div class="icon">📊</div><p>Nenhum dado ainda.</p></div>`;
    return;
  }

  div.innerHTML = Object.entries(resumo).map(([macro, d]) => {
    const pct  = Math.round(d.ok / d.total * 100);
    const cor  = pct === 100 ? "var(--verde)" : pct > 0 ? "var(--amarelo)" : "var(--cinza)";
    return `
      <div class="resumo-card">
        <div>
          <div class="resumo-macro">${macro}</div>
          <div class="resumo-sub">${d.total} registro${d.total!==1?"s":""} · ${d.unidades.size} unidade${d.unidades.size!==1?"s":""}</div>
        </div>
        <div style="text-align:right">
          <div class="resumo-pct" style="color:${cor}">${pct}%</div>
          <div style="font-size:11px;color:var(--cinza)">${d.ok}/${d.total}</div>
        </div>
      </div>`;
  }).join("");
}

// ─── EXPORTAÇÃO ──────────────────────────────────────────────
function exportCSV() {
  if (!registros.length) { toast("Nenhum dado para exportar"); return; }
  const h = ["Unidade","Macro","Sub","Tarefa","Equipe","Data Início","Data Conclusão"];
  const rows = registros.map(r => [
    r.Unidade, r.Macro, r.Sub||"", r.Tarefa, r.Equipe,
    fmtData(r.DataInicio), r.DataConclusao ? fmtData(r.DataConclusao) : ""
  ]);
  const csv = [h,...rows].map(row => row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  baixar("\uFEFF"+csv, "medicoes_"+hoje()+".csv", "text/csv;charset=utf-8");
}

function exportXLSX() {
  if (!registros.length) { toast("Nenhum dado para exportar"); return; }
  const rows = registros.map(r => ({
    "Unidade":        Number(r.Unidade),
    "Macro":          r.Macro,
    "Sub":            r.Sub || "",
    "Tarefa":         r.Tarefa,
    "Equipe":         r.Equipe,
    "Data Início":    fmtData(r.DataInicio),
    "Data Conclusão": r.DataConclusao ? fmtData(r.DataConclusao) : ""
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Medições");
  XLSX.writeFile(wb, "medicoes_" + hoje() + ".xlsx");
}

// ─── UTILITÁRIOS ─────────────────────────────────────────────
function fmtData(d) {
  if (!d) return "–";
  const [y,m,dia] = d.split("-");
  return `${dia}/${m}/${y}`;
}

function hoje() {
  return new Date().toISOString().split("T")[0];
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2500);
}

function esc(s) { return s.replace(/'/g,"\\'"); }

function baixar(conteudo, nome, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], {type: tipo}));
  a.download = nome;
  a.click();
}

// ─── INIT ────────────────────────────────────────────────────
carregar();
</script>
