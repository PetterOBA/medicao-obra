<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Medição de Obra — SUMMUS</title>
<style>
  :root{
    --navy:#0a1338;
    --navy2:#0c1fa0;
    --gold:#c9a227;
    --bg:#f2f3f6;
    --card:#ffffff;
    --line:#e4e6ee;
    --txt:#171b2e;
    --txt2:#5c6377;
    --txt3:#9298a8;
    --gray:#a3aab8;
    --grayBg:#eef0f4;
    --amber:#e5940f;
    --amberBg:#fdf1dc;
    --green:#1a9e5c;
    --greenBg:#e2f6ea;
    --danger:#d43f3f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

  /* header */
  header{
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    color:#fff;padding:16px 18px 14px;
    position:sticky;top:0;z-index:20;
    border-bottom:3px solid var(--gold);
  }
  .brandrow{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:800;letter-spacing:.06em;font-size:15px;}
  .brand small{display:block;font-weight:500;letter-spacing:.14em;font-size:9px;color:var(--gold);margin-top:1px;}
  .hbtn{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:9px;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .hbtn:active{background:rgba(255,255,255,.22);}
  .htitle{font-size:18px;font-weight:700;margin-top:2px;}
  .hsub{font-size:12.5px;color:#c7cdea;margin-top:2px;}

  /* screens */
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* home screen */
  .home{padding:22px 18px 40px;gap:14px;display:flex;flex-direction:column;}
  .home-hint{color:var(--txt2);font-size:13.5px;margin-bottom:2px;}
  .projcard{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px 18px;display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;transition:transform .1s;
  }
  .projcard:active{transform:scale(.98);background:#fafaff;}
  .projcard .pname{font-weight:700;font-size:16px;color:var(--navy);}
  .projcard .pmeta{font-size:12.5px;color:var(--txt2);margin-top:3px;}
  .projcard .parrow{font-size:20px;color:var(--gold);}
  .projprog{display:flex;align-items:center;gap:7px;margin-top:9px;}
  .projprog .bar{flex:1;height:6px;background:var(--grayBg);border-radius:4px;overflow:hidden;}
  .projprog .bar i{display:block;height:100%;background:var(--green);border-radius:4px;}
  .projprog .pct{font-size:11.5px;color:var(--txt2);font-weight:600;min-width:32px;text-align:right;}

  /* grid screen */
  .gridwrap{padding:14px 16px 30px;flex:1;}
  .searchrow{display:flex;gap:8px;margin-bottom:14px;}
  .searchrow input{
    flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;background:var(--card);
  }
  .searchrow input:focus{outline:2px solid var(--navy2);}
  .legend{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .legend span{font-size:11.5px;color:var(--txt2);display:flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:3px;display:block;}
  .unitgrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;
  }
  .unit{
    aspect-ratio:1;border-radius:10px;border:1px solid var(--line);
    background:var(--grayBg);color:var(--txt);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;cursor:pointer;position:relative;
  }
  .unit:active{transform:scale(.93);}
  .unit.andamento{background:var(--amberBg);color:#8a5a06;border-color:#f0cf94;}
  .unit.concluido{background:var(--greenBg);color:#0d6b3c;border-color:#a6e2c1;}

  /* detail screen */
  .detailhead{padding:14px 16px 10px;}
  .unitbig{font-size:20px;font-weight:800;color:var(--navy);}
  .unitprog{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .unitprog .bar{flex:1;height:7px;background:var(--grayBg);border-radius:4px;overflow:hidden;}
  .unitprog .bar i{display:block;height:100%;border-radius:4px;background:var(--green);}
  .unitprog .pct{font-size:12px;color:var(--txt2);font-weight:700;min-width:34px;text-align:right;}
  .stagelist{padding:6px 16px 40px;display:flex;flex-direction:column;gap:9px;}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
  .stagehead{display:flex;align-items:center;padding:12px 13px;gap:10px;cursor:pointer;}
  .stagename{flex:1;font-size:14.5px;font-weight:600;}
  .stagesub{font-size:11.5px;color:var(--txt3);margin-top:1px;font-weight:400;}
  .pill{
    font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;
    background:var(--grayBg);color:var(--txt2);white-space:nowrap;
    display:flex;align-items:center;gap:5px;border:none;cursor:pointer;
  }
  .pill.andamento{background:var(--amberBg);color:#8a5a06;}
  .pill.concluido{background:var(--greenBg);color:#0d6b3c;}
  .chev{color:var(--txt3);font-size:12px;transition:transform .15s;padding:4px;}
  .stage.open .chev{transform:rotate(90deg);}
  .substuff{display:none;border-top:1px solid var(--line);}
  .stage.open .substuff{display:block;}
  .subrow{display:flex;align-items:center;padding:10px 13px 10px 24px;gap:10px;border-top:1px solid #f0f1f5;}
  .subrow:first-child{border-top:none;}
  .subname{flex:1;font-size:13.5px;color:var(--txt);}
  .cascaderow{display:flex;gap:8px;padding:8px 13px 12px 24px;border-top:1px solid #f0f1f5;}
  .cascadebtn{
    flex:1;border:1px solid var(--line);background:var(--bg);color:var(--txt2);
    border-radius:9px;padding:8px 6px;font-size:12px;font-weight:600;cursor:pointer;
  }
  .cascadebtn.ok{color:#0d6b3c;border-color:#a6e2c1;background:var(--greenBg);}
  .cascadebtn.reset{color:var(--danger);}
  .cascadebtn:active{opacity:.7;}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:100;font-weight:600;
    display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--danger);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .dot.spin{animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .loading{padding:40px 20px;text-align:center;color:var(--txt2);font-size:13.5px;}
  .empty{padding:40px 20px;text-align:center;color:var(--txt3);font-size:13px;}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brandrow">
      <div class="brand">SUMMUS<small>ENGENHARIA</small></div>
      <button class="hbtn" id="btnBack" style="display:none;" aria-label="Voltar">←</button>
    </div>
    <div id="headTitle" class="htitle">Medição de Obra</div>
    <div id="headSub" class="hsub">Selecione o empreendimento</div>
  </header>

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="home">
      <div class="home-hint">Toque num empreendimento pra lançar o andamento das unidades.</div>
      <div id="homeCards"></div>
    </div>
  </div>

  <!-- GRID -->
  <div class="screen" id="screen-grid">
    <div class="gridwrap">
      <div class="searchrow">
        <input type="number" inputmode="numeric" id="searchUnit" placeholder="Ir direto pra unidade nº...">
      </div>
      <div class="legend">
        <span><i style="background:var(--gray)"></i>Não iniciado</span>
        <span><i style="background:var(--amber)"></i>Em andamento</span>
        <span><i style="background:var(--green)"></i>Concluído</span>
      </div>
      <div id="unitGrid" class="unitgrid"></div>
      <div id="gridLoading" class="loading" style="display:none;">Carregando status das unidades...</div>
    </div>
  </div>

  <!-- DETAIL -->
  <div class="screen" id="screen-detail">
    <div class="detailhead">
      <div class="unitbig" id="unitTitle">Casa 1</div>
      <div class="unitprog"><div class="bar"><i id="unitBar" style="width:0%"></i></div><div class="pct" id="unitPct">0%</div></div>
    </div>
    <div class="stagelist" id="stageList"></div>
  </div>

</div>

<div class="toast" id="toast"><span class="dot" id="toastDot"></span><span id="toastMsg">Salvo</span></div>

<script>
/* ======================= CONFIG ======================= */
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyqJDYbqxZG1B86X_bIsRtmRb7W-J-jcPF-n1apeEuBdWPsI3F-_WYcPG6I39u-HPNK/exec";

const EMPREENDIMENTOS = {
  GOIANIA: { id:"GOIANIA", nome:"Supremo Goiânia", total:72, prefixo:"Casa" },
  GOIAS:   { id:"GOIAS",   nome:"Supremo Goiás",  total:149, prefixo:"Unidade" }
};

// Estrutura macro-etapa / sub-etapa (base: EAP Custo Direto - Casas)
const STAGES = [
  { codigo:"01.03.01", nome:"Serviços Preliminares", subs:[] },
  { codigo:"01.03.02", nome:"Fundação", subs:[
      { codigo:"01.03.02.01", nome:"Fundação Profunda" },
      { codigo:"01.03.02.02", nome:"Fundação Rasa" }
  ]},
  { codigo:"01.03.03", nome:"Estrutura", subs:[] },
  { codigo:"01.03.04", nome:"Alvenaria", subs:[
      { codigo:"01.03.04.01", nome:"Alvenaria de Vedação" },
      { codigo:"01.03.04.02", nome:"Alvenaria Estrutural" },
      { codigo:"01.03.04.03", nome:"Drywall" },
      { codigo:"01.03.04.04", nome:"Demais Fechamentos" }
  ]},
  { codigo:"01.03.05", nome:"Cobertura", subs:[] },
  { codigo:"01.03.06", nome:"Impermeabilização", subs:[] },
  { codigo:"01.03.07", nome:"Revestimento Interno", subs:[
      { codigo:"01.03.07.01", nome:"Revestimento de Massa" },
      { codigo:"01.03.07.02", nome:"Revestimento de Gesso" },
      { codigo:"01.03.07.03", nome:"Revestimento Cerâmico" },
      { codigo:"01.03.07.04", nome:"Forro" }
  ]},
  { codigo:"01.03.08", nome:"Revestimento Externo", subs:[] },
  { codigo:"01.03.09", nome:"Pisos", subs:[
      { codigo:"01.03.09.01", nome:"Pisos Internos e Externos" },
      { codigo:"01.03.09.02", nome:"Rodapé" }
  ]},
  { codigo:"01.03.10", nome:"Mármores e Granitos", subs:[] },
  { codigo:"01.03.11", nome:"Esquadrias", subs:[
      { codigo:"01.03.11.01", nome:"Esquadrias de Alumínio / Vidro" },
      { codigo:"01.03.11.02", nome:"Esquadrias de Madeira" },
      { codigo:"01.03.11.03", nome:"Esquadrias de Ferro" }
  ]},
  { codigo:"01.03.12", nome:"Instalações Elétrica", subs:[] },
  { codigo:"01.03.13", nome:"Instalações Hidráulica", subs:[
      { codigo:"01.03.13.01", nome:"Instalações Hidráulica" },
      { codigo:"01.03.13.02", nome:"Louças e Metais" },
      { codigo:"01.03.13.03", nome:"Instalações de Gás" },
      { codigo:"01.03.13.04", nome:"Instalações de Incêndio" }
  ]},
  { codigo:"01.03.14", nome:"Instalações Mecânicas", subs:[] },
  { codigo:"01.03.15", nome:"Elevador", subs:[] },
  { codigo:"01.03.16", nome:"Pintura", subs:[
      { codigo:"01.03.16.01", nome:"Pintura Interna" },
      { codigo:"01.03.16.02", nome:"Pintura Externa" },
      { codigo:"01.03.16.03", nome:"Pintura de Piso e Esquadrias" }
  ]},
  { codigo:"01.03.17", nome:"Limpeza", subs:[] }
];

// status possíveis para qualquer folha (macro sem sub, ou sub)
const STATUS = ["nao_iniciado","andamento","concluido"];
const STATUS_LABEL = { nao_iniciado:"Não iniciado", andamento:"Em andamento", concluido:"Concluído" };

/* ======================= ESTADO ======================= */
// dados[empId][unidade][codigo] = status
let DADOS = { GOIANIA:{}, GOIAS:{} };
let LOADED = { GOIANIA:false, GOIAS:false };
let currentEmp = null;
let currentUnit = null;

/* ======================= HELPERS ======================= */
function leavesOf(stage){
  return stage.subs.length ? stage.subs.map(s=>s.codigo) : [stage.codigo];
}
function allLeaves(){
  let out = [];
  STAGES.forEach(s => out = out.concat(leavesOf(s)));
  return out;
}
const ALL_LEAVES = allLeaves();

function getStatus(emp, unidade, codigo){
  const u = DADOS[emp] && DADOS[emp][unidade];
  return (u && u[codigo]) || "nao_iniciado";
}
function setStatusLocal(emp, unidade, codigo, status){
  if(!DADOS[emp][unidade]) DADOS[emp][unidade] = {};
  DADOS[emp][unidade][codigo] = status;
}
function stageStatus(emp, unidade, stage){
  const leaves = leavesOf(stage);
  const statuses = leaves.map(c => getStatus(emp, unidade, c));
  if(statuses.every(s => s==="concluido")) return "concluido";
  if(statuses.some(s => s!=="nao_iniciado")) return "andamento";
  return "nao_iniciado";
}
function unitProgress(emp, unidade){
  const total = ALL_LEAVES.length;
  const done = ALL_LEAVES.filter(c => getStatus(emp, unidade, c)==="concluido").length;
  return Math.round((done/total)*100);
}
function unitOverallStatus(emp, unidade){
  const pct = unitProgress(emp, unidade);
  if(pct===100) return "concluido";
  if(pct>0) return "andamento";
  return "nao_iniciado";
}
function empProgress(emp){
  const total = EMPREENDIMENTOS[emp].total * ALL_LEAVES.length;
  let done = 0;
  for(let i=1;i<=EMPREENDIMENTOS[emp].total;i++){
    done += ALL_LEAVES.filter(c => getStatus(emp, String(i), c)==="concluido").length;
  }
  return total ? Math.round((done/total)*100) : 0;
}

function toast(msg, isErr, spinning){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  const dot = document.getElementById("toastDot");
  dot.classList.toggle("spin", !!spinning);
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  if(!spinning){
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove("show"), 1800);
  }
}
function hideToast(){ document.getElementById("toast").classList.remove("show"); }

/* ======================= API ======================= */
function api(params){
  const qs = new URLSearchParams(params).toString();
  return fetch(URL_SCRIPT + "?" + qs).then(r=>r.json());
}
function loadEmp(emp){
  if(LOADED[emp]) return Promise.resolve();
  document.getElementById("gridLoading").style.display = "block";
  return api({ action:"load", emp })
    .then(res=>{
      if(res.success){
        const map = {};
        (res.data||[]).forEach(row=>{
          if(!map[row.Unidade]) map[row.Unidade] = {};
          map[row.Unidade][row.CodigoEtapa] = row.Status;
        });
        DADOS[emp] = map;
        LOADED[emp] = true;
      }
    })
    .catch(()=> toast("Não deu pra carregar dados salvos. Conferindo offline.", true))
    .finally(()=> document.getElementById("gridLoading").style.display = "none");
}
function saveOne(emp, unidade, codigo, nome, status){
  setStatusLocal(emp, unidade, codigo, status);
  renderDetail();
  toast("Salvando...", false, true);
  api({ action:"save", emp, unidade, codigo, nome, status })
    .then(res=>{
      if(res.success) toast("Salvo"); else toast("Erro ao salvar", true);
    })
    .catch(()=> toast("Sem conexão — tente de novo", true));
}
function saveBatch(emp, unidade, items){
  items.forEach(it => setStatusLocal(emp, unidade, it.codigo, it.status));
  renderDetail();
  toast("Salvando...", false, true);
  api({ action:"saveBatch", emp, unidade, items: JSON.stringify(items) })
    .then(res=>{
      if(res.success) toast("Salvo"); else toast("Erro ao salvar", true);
    })
    .catch(()=> toast("Sem conexão — tente de novo", true));
}

/* ======================= NAV ======================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
document.getElementById("btnBack").addEventListener("click", ()=>{
  if(document.getElementById("screen-detail").classList.contains("active")){
    openGrid(currentEmp);
  } else if(document.getElementById("screen-grid").classList.contains("active")){
    openHome();
  }
});

function openHome(){
  currentEmp = null; currentUnit = null;
  document.getElementById("btnBack").style.display = "none";
  document.getElementById("headTitle").textContent = "Medição de Obra";
  document.getElementById("headSub").textContent = "Selecione o empreendimento";
  renderHome();
  showScreen("screen-home");
}
function openGrid(emp){
  currentEmp = emp; currentUnit = null;
  const info = EMPREENDIMENTOS[emp];
  document.getElementById("btnBack").style.display = "flex";
  document.getElementById("headTitle").textContent = info.nome;
  document.getElementById("headSub").textContent = info.total + " unidades";
  showScreen("screen-grid");
  loadEmp(emp).then(renderGrid);
  renderGrid();
}
function openDetail(unidade){
  currentUnit = String(unidade);
  const info = EMPREENDIMENTOS[currentEmp];
  document.getElementById("btnBack").style.display = "flex";
  document.getElementById("headTitle").textContent = info.nome;
  document.getElementById("headSub").textContent = info.prefixo + " " + unidade;
  document.getElementById("unitTitle").textContent = info.prefixo + " " + unidade;
  showScreen("screen-detail");
  renderDetail();
}

/* ======================= RENDER ======================= */
function renderHome(){
  const wrap = document.getElementById("homeCards");
  wrap.innerHTML = "";
  Object.values(EMPREENDIMENTOS).forEach(info=>{
    const pct = LOADED[info.id] ? empProgress(info.id) : null;
    const card = document.createElement("div");
    card.className = "projcard";
    card.innerHTML = `
      <div style="flex:1">
        <div class="pname">${info.nome}</div>
        <div class="pmeta">${info.total} unidades</div>
        <div class="projprog"><div class="bar"><i style="width:${pct||0}%"></i></div><div class="pct">${pct===null?"–":pct+"%"}</div></div>
      </div>
      <div class="parrow">›</div>`;
    card.addEventListener("click", ()=> openGrid(info.id));
    wrap.appendChild(card);
  });
}

function renderGrid(){
  const grid = document.getElementById("unitGrid");
  const info = EMPREENDIMENTOS[currentEmp];
  grid.innerHTML = "";
  for(let i=1;i<=info.total;i++){
    const u = String(i);
    const st = unitOverallStatus(currentEmp, u);
    const btn = document.createElement("div");
    btn.className = "unit" + (st!=="nao_iniciado" ? " "+st : "");
    btn.textContent = i;
    btn.addEventListener("click", ()=> openDetail(u));
    grid.appendChild(btn);
  }
}

document.getElementById("searchUnit").addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    const v = parseInt(e.target.value,10);
    const info = EMPREENDIMENTOS[currentEmp];
    if(v>=1 && v<=info.total){ e.target.value=""; openDetail(String(v)); }
  }
});

function renderDetail(){
  const list = document.getElementById("stageList");
  const emp = currentEmp, unidade = currentUnit;
  const pct = unitProgress(emp, unidade);
  document.getElementById("unitBar").style.width = pct + "%";
  document.getElementById("unitPct").textContent = pct + "%";

  // preserve which stages are open
  const openSet = new Set(Array.from(list.querySelectorAll(".stage.open")).map(el=>el.dataset.codigo));

  list.innerHTML = "";
  STAGES.forEach(stage=>{
    const status = stageStatus(emp, unidade, stage);
    const hasSubs = stage.subs.length>0;
    const doneCount = hasSubs ? stage.subs.filter(s=>getStatus(emp,unidade,s.codigo)==="concluido").length : 0;

    const el = document.createElement("div");
    el.className = "stage" + (openSet.has(stage.codigo) ? " open" : "");
    el.dataset.codigo = stage.codigo;

    const head = document.createElement("div");
    head.className = "stagehead";
    head.innerHTML = `
      <div style="flex:1">
        <div class="stagename">${stage.nome}</div>
        ${hasSubs ? `<div class="stagesub">${doneCount}/${stage.subs.length} sub-etapas concluídas</div>` : ""}
      </div>
      ${hasSubs ? "" : `<button class="pill ${status!=="nao_iniciado"?status:""}" data-act="cyclemacro">${STATUS_LABEL[status]}</button>`}
      ${hasSubs ? `<span class="pill ${status!=="nao_iniciado"?status:""}">${STATUS_LABEL[status]}</span><span class="chev">▸</span>` : ""}
    `;
    el.appendChild(head);

    if(hasSubs){
      const box = document.createElement("div");
      box.className = "substuff";
      stage.subs.forEach(sub=>{
        const sStatus = getStatus(emp, unidade, sub.codigo);
        const row = document.createElement("div");
        row.className = "subrow";
        row.innerHTML = `
          <div class="subname">${sub.nome}</div>
          <button class="pill ${sStatus!=="nao_iniciado"?sStatus:""}" data-act="cyclesub" data-codigo="${sub.codigo}" data-nome="${sub.nome}">${STATUS_LABEL[sStatus]}</button>
        `;
        box.appendChild(row);
      });
      const casc = document.createElement("div");
      casc.className = "cascaderow";
      casc.innerHTML = `
        <button class="cascadebtn ok" data-act="marcartudo">✓ Marcar tudo concluído</button>
        <button class="cascadebtn reset" data-act="resettudo">↺ Reset</button>
      `;
      box.appendChild(casc);
      el.appendChild(box);

      head.addEventListener("click", (e)=>{
        if(e.target.closest("[data-act]")) return;
        el.classList.toggle("open");
      });
    }

    list.appendChild(el);
  });

  // event delegation for pills / cascade buttons
  list.querySelectorAll('[data-act="cyclemacro"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const stageEl = btn.closest(".stage");
      const codigo = stageEl.dataset.codigo;
      const stage = STAGES.find(s=>s.codigo===codigo);
      const cur = getStatus(emp, unidade, codigo);
      const next = STATUS[(STATUS.indexOf(cur)+1) % STATUS.length];
      saveOne(emp, unidade, codigo, stage.nome, next);
    });
  });
  list.querySelectorAll('[data-act="cyclesub"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const codigo = btn.dataset.codigo, nome = btn.dataset.nome;
      const cur = getStatus(emp, unidade, codigo);
      const next = STATUS[(STATUS.indexOf(cur)+1) % STATUS.length];
      saveOne(emp, unidade, codigo, nome, next);
    });
  });
  list.querySelectorAll('[data-act="marcartudo"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const stageEl = btn.closest(".stage");
      const stage = STAGES.find(s=>s.codigo===stageEl.dataset.codigo);
      const items = stage.subs.map(s=>({codigo:s.codigo, nome:s.nome, status:"concluido"}));
      saveBatch(emp, unidade, items);
    });
  });
  list.querySelectorAll('[data-act="resettudo"]').forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      const stageEl = btn.closest(".stage");
      const stage = STAGES.find(s=>s.codigo===stageEl.dataset.codigo);
      const items = stage.subs.map(s=>({codigo:s.codigo, nome:s.nome, status:"nao_iniciado"}));
      saveBatch(emp, unidade, items);
    });
  });

  // refresh grid dots in background too (so going back shows updated colors without refetch)
}

/* ======================= INIT ======================= */
openHome();
</script>
</body>
</html>
